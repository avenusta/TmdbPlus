name: Publish to NuGet

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for nuget.org trusted publishing
      contents: write # create the tag and GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Only the library: TmdbPlus.Tests runs against live TMDB fixtures in gitignored audit/.
      # ContinuousIntegrationBuild lives here, not the csproj: it normalizes source paths, which
      # is right for a shipped build but breaks local debugging.
      - run: dotnet pack TmdbPlus/TmdbPlus.csproj -c Release -o out -p:ContinuousIntegrationBuild=true

      # Trades the OIDC token for an API key valid 1 hour, so it goes right before the push.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # skip-duplicate: re-pushing an unbumped <Version> is a no-op, not a failed run.
      - run: dotnet nuget push "out/*.nupkg" -s https://api.nuget.org/v3/index.json -k "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      # The csproj is the one source of truth; the tag follows it. tr -d '\r' because MSBuild
      # emits a trailing CR that would otherwise land inside the tag name.
      - id: ver
        run: echo "v=$(dotnet msbuild TmdbPlus/TmdbPlus.csproj -getProperty:Version | tr -d '\r')" >> "$GITHUB_OUTPUT"

      # Runs after the push so a failed publish leaves no tag claiming a version that never shipped.
      # '|| true' keeps a re-run on an unbumped version green, matching --skip-duplicate above.
      - run: gh release create "v${{ steps.ver.outputs.v }}" out/*.nupkg --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
